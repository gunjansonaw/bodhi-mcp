name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the tool name, its arguments and the output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bodhi-mcp version
      placeholder: "0.1.0"
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "e.g. Claude Code, MCP Inspector"
