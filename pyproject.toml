[project]
name = "bodhi-mcp"
version = "0.1.0"
description = "Read-only MCP server for Fedora's Bodhi update system"
readme = "README.md"
authors = [{ name = "Gunjan Sonawane" }]
keywords = ["mcp", "fedora", "bodhi", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3",
    "pydantic>=2.14.4",
]

[project.urls]
Homepage = "https://github.com/gunjansonaw/bodhi-mcp"
Issues = "https://github.com/gunjansonaw/bodhi-mcp/issues"
Changelog = "https://github.com/gunjansonaw/bodhi-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.8",
]

[project.scripts]
bodhi-mcp = "bodhi_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
